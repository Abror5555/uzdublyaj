[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "uzdublyaj"
dynamic = ["version"]
description = "Translate English, Russian and Korean video tutorials (YouTube or local files) into Uzbek: subtitles and AI voice-over dubbing with Google Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abror Kushshiyev", email = "abrorkushshiyev@gmail.com" }]
keywords = ["uzbek", "dubbing", "subtitles", "translation", "youtube", "gemini", "tts", "speech-to-text", "video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "google-genai>=2.25.0",
    "yt-dlp[default]>=2026.8.19",
    "deno>=2.5",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=6"]

[project.scripts]
uzdublyaj = "uzdublyaj.cli:main"

[project.urls]
Homepage = "https://github.com/Abror5555/uzdublyaj"
Source = "https://github.com/Abror5555/uzdublyaj"
Issues = "https://github.com/Abror5555/uzdublyaj/issues"

[tool.hatch.version]
path = "src/uzdublyaj/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uzdublyaj"]

[tool.hatch.build.targets.sdist]
include = ["src/uzdublyaj", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
